packages:
  - 'apps/*'
  - 'packages/*'
# pnpm v11 replaced `onlyBuiltDependencies` with the `allowBuilds` map.
# These packages have install/build scripts we trust and want to run.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true

# Security pins for transitive dependencies. Each of these is pulled in by
# something we depend on rather than declared by us, so the only way to move
# them is from here. Every entry closes one or more Dependabot advisories;
# the parenthetical names the package that drags it in.
#
# Remove an entry once the parent ships a version that resolves at or above
# the pin on its own — an override that no longer changes anything is dead
# config, and pnpm will not warn you about it. Worse, an exact pin keeps
# working against you: once a newer advisory lands, the pin caps the package
# below the fix and Dependabot's security updates fail with
# `security_update_not_possible`. That is what happened to the qs, body-parser,
# follow-redirects, js-yaml and brace-expansion pins that used to live here;
# their parents (express, axios, eslint, minimatch) now resolve to patched
# versions on their own, so a plain lockfile refresh carries the fixes.
overrides:
  dompurify: '3.4.17' # monaco-editor hard-pins 3.4.15; 15+ advisories, latest critical
  # vitest accepts vite ^6 || ^7 || ^8 and bundles its own copy, so the backend
  # — which has no vite of its own — would otherwise resolve the newest vite
  # major and run its tests on a different vite than the frontend builds with.
  # A range, not a pin: vite 6 patches should still flow.
  vite: '^6.4.5'
