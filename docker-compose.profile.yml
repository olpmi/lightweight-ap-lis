# Resource-profiling override — layer on docker-compose.yml, own project name:
#
#   docker compose -p lis-profile -f docker-compose.yml -f docker-compose.profile.yml up -d --build --wait
#
# Driven by `pnpm metrics:deployment`; you rarely need to run it by hand.
#
# Why a separate stack rather than reusing the default one: profiling starts from
# a pristine 300-case corpus, so it has to be free to `down -v`. Doing that to the
# default project would destroy whatever is in the developer's postgres_data
# volume. A distinct project name isolates the volumes; distinct container names
# and published ports let the profile stack run while the dev stack is up.
#
# `container_name` is global to the daemon, not scoped to the project, so it must
# be overridden explicitly. Published ports must use the `!override` tag because
# Compose *appends* sequences when merging — without it the profile stack would
# also try to bind 5432/3001/5173 and collide with the dev stack. Same tag, same
# reason, as docker-compose.dev.yml.

services:
  postgres:
    container_name: lis-profile-postgres
    ports: !override
      - '55432:5432'

  backend:
    container_name: lis-profile-backend
    ports: !override
      - '3101:3001'
    environment:
      CORS_ORIGIN: http://localhost:5273

  frontend:
    container_name: lis-profile-frontend
    ports: !override
      - '5273:80'
    environment:
      VITE_API_BASE_URL: http://backend:3001
