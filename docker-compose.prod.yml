# Production stack — standalone (do NOT layer on docker-compose.yml).
#
# Usage:
#   cp .env.production.example .env.production
#   # Fill in all required values (see .env.production.example for details).
#
#   # GCS backup is optional. If WALG_GCS_PREFIX is set in .env.production:
#   mkdir -p secrets && cp /path/to/gcp-sa.json secrets/gcp-sa.json
#   chmod 644 secrets/gcp-sa.json
#
#   # Start without GCS backup:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
#   # Start with GCS backup scheduler (requires WALG_GCS_PREFIX to be set):
#   docker compose --env-file .env.production -f docker-compose.prod.yml \
#     --profile backup up -d --build
#
# `--env-file .env.production` is required so that ${VAR} references in this
# file are interpolated at compose-parse time (e.g. healthcheck test strings).
#
# Topology:
#   postgres_primary  — writable primary; backend writes here.
#   postgres_standby  — hot standby (streaming replication); backend can read
#                       from here via DATABASE_URL_REPLICA.
#   backup_cron       — (profile: backup) daily wal-g base backup to GCS.
#   backend           — Node.js API; runs prisma migrate deploy on startup.
#   frontend          — nginx serving the React SPA.
#
# Manual failover (promote standby):
#   docker exec lis-postgres-standby psql -U ${POSTGRES_USER} \
#     -c "SELECT pg_promote();"
#   # Then update DATABASE_URL in .env.production → postgres_standby and
#   # restart the backend service.

services:
  # ─── PostgreSQL Primary ──────────────────────────────────────────────────
  postgres_primary:
    build:
      context: docker/postgres
    container_name: lis-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      # WAL-G / GCS archiving (leave WALG_GCS_PREFIX empty to use local archive).
      WALG_GCS_PREFIX: ${WALG_GCS_PREFIX:-}
      WALG_COMPRESSION_METHOD: ${WALG_COMPRESSION_METHOD:-lz4}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - wal_archive:/wal-archive
      - ./secrets:/secrets:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL Hot Standby ───────────────────────────────────────────────
  # On first start: clones the primary via pg_basebackup then enters
  # streaming-replication standby mode.  On restart: resumes from where it
  # left off.  Accepts read-only queries (hot_standby = on).
  postgres_standby:
    build:
      context: docker/postgres
    container_name: lis-postgres-standby
    restart: unless-stopped
    entrypoint: ['/scripts/standby-entrypoint.sh']
    command: ['postgres']
    depends_on:
      postgres_primary:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PRIMARY_HOST: postgres_primary
      WALG_GCS_PREFIX: ${WALG_GCS_PREFIX:-}
      WALG_COMPRESSION_METHOD: ${WALG_COMPRESSION_METHOD:-lz4}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
    volumes:
      - postgres_standby_data:/var/lib/postgresql/data
      - wal_archive:/wal-archive
      - ./secrets:/secrets:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── GCS Base Backup Scheduler ───────────────────────────────────────────
  # Only started when --profile backup is passed.
  # Runs busybox crond (foreground) and fires /scripts/backup-cron.sh at the
  # schedule defined in docker/postgres/crontab (default: 02:00 UTC daily).
  # Connects to postgres_primary for pg_backup_start/stop; reads PGDATA from
  # the primary's volume (read-only — PG16 non-exclusive backup API does not
  # write to the data directory).
  backup_cron:
    build:
      context: docker/postgres
    container_name: lis-backup-cron
    restart: unless-stopped
    profiles: ['backup']
    user: root
    entrypoint: ['cron', '-f']
    depends_on:
      postgres_primary:
        condition: service_healthy
    environment:
      PGDATA: /var/lib/postgresql/data
      PGHOST: postgres_primary
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      WALG_GCS_PREFIX: ${WALG_GCS_PREFIX}
      WALG_COMPRESSION_METHOD: ${WALG_COMPRESSION_METHOD:-lz4}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data:ro
      - ./secrets:/secrets:ro

  # ─── Backend ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: lis-backend
    restart: unless-stopped
    depends_on:
      postgres_primary:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - '3001:3001'
    volumes:
      - generated_files:/app/apps/backend/storage
    command: >
      sh -c "
        npx prisma migrate deploy --schema=prisma/schema.prisma &&
        node apps/backend/dist/server.js
      "

  # ─── Frontend ────────────────────────────────────────────────────────────
  # The bundle uses a relative /api baseURL served by nginx, which proxies to
  # the backend over the compose network — no build-time API URL needed.
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_PASSWORD_AUTH: 'true'
    container_name: lis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  postgres_primary_data:
  postgres_standby_data:
  wal_archive:
  generated_files:
