services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lis_user
      POSTGRES_PASSWORD: lis_password
      POSTGRES_DB: lis_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lis_user -d lis_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: lis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lis_user:lis_password@postgres:5432/lis_db
      SESSION_SECRET: docker-dev-secret-change-in-production
      NODE_ENV: development
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
      # This stack seeds synthetic patients, referrers and staff. Stated
      # explicitly rather than relying on the NODE_ENV default, so the guarantee
      # is visible where the stack is defined.
      DEMO_MODE: 'true'
    ports:
      - '3001:3001'
    volumes:
      - generated_files:/app/apps/backend/storage
    command: >
      sh -c "
        npx prisma migrate deploy --schema=prisma/schema.prisma &&
        npx tsx prisma/seed.ts &&
        node apps/backend/dist/server.js
      "
    # Without this there is no container-level signal for "migrated, seeded and
    # listening", so anything waiting on the stack has to poll /health from the
    # host. The runtime image carries no curl or wget (docker/backend.Dockerfile
    # installs only openssl, chromium and fonts), so the probe uses Node's own
    # global fetch. start_period covers migrations plus the 300-case seed.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ─── Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: lis-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://backend:3001
    ports:
      - '5173:80'

volumes:
  postgres_data:
  generated_files:
