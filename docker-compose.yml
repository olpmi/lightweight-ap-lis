version: '3.9'

services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lis_user
      POSTGRES_PASSWORD: lis_password
      POSTGRES_DB: lis_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lis_user -d lis_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: lis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lis_user:lis_password@postgres:5432/lis_db
      SESSION_SECRET: docker-dev-secret-change-in-production
      NODE_ENV: development
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3001:3001'
    volumes:
      - generated_files:/app/apps/backend/storage
    command: >
      sh -c "
        npx prisma migrate deploy --schema=prisma/schema.prisma &&
        npx tsx prisma/seed.ts &&
        node apps/backend/dist/server.js
      "

  # ─── Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: lis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://backend:3001
    ports:
      - '5173:80'

volumes:
  postgres_data:
  generated_files:
