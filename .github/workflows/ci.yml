name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Install & Typecheck ──────────────────────────────────────────────────
  setup:
    name: Install & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Typecheck backend
        run: npm run typecheck --workspace=apps/backend

      - name: Typecheck frontend
        run: npm run typecheck --workspace=apps/frontend

  # ─── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root
      - run: npm run build --workspace=packages/shared
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npx eslint apps/backend/src --ext .ts
      - run: npx eslint apps/frontend/src --ext .ts,.tsx

  # ─── Backend tests ────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lis_user
          POSTGRES_PASSWORD: lis_password
          POSTGRES_DB: lis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://lis_user:lis_password@localhost:5432/lis_test
      SESSION_SECRET: test-ci-secret-do-not-use-in-production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --workspaces --include-workspace-root

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Run backend tests with coverage
        run: npm run test:coverage --workspace=apps/backend

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          if-no-files-found: warn

  # ─── Frontend tests ───────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root
      - run: npm run build --workspace=packages/shared
      - run: npx prisma generate --schema=prisma/schema.prisma
      - name: Run frontend tests with coverage
        run: npm run test:coverage --workspace=apps/frontend

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/
          if-no-files-found: warn

  # ─── Playwright E2E ───────────────────────────────────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lis_user
          POSTGRES_PASSWORD: lis_password
          POSTGRES_DB: lis_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://lis_user:lis_password@localhost:5432/lis_e2e
      SESSION_SECRET: test-ci-e2e-secret
      PORT: 3001

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --workspaces --include-workspace-root

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run migrations and seed
        run: |
          npx prisma migrate deploy --schema=prisma/schema.prisma
          npx tsx prisma/seed.ts

      - name: Build backend
        run: npm run build --workspace=apps/backend

      - name: Start backend in background
        run: node apps/backend/dist/server.js &
        env:
          DATABASE_URL: postgresql://lis_user:lis_password@localhost:5432/lis_e2e
          SESSION_SECRET: test-ci-e2e-secret

      - name: Build frontend
        run: npm run build --workspace=apps/frontend

      - name: Serve built frontend on :5173
        run: npm run preview --workspace=apps/frontend -- --host 0.0.0.0 --port 5173 --strictPort &

      - name: Wait for backend + frontend to be ready
        run: npx --yes wait-on@7 http://localhost:3001/health http://localhost:5173 --timeout 60000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e --workspace=apps/frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          PLAYWRIGHT_BACKEND_URL: http://localhost:3001

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: apps/frontend/test-results/
