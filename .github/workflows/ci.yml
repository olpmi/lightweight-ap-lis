name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Path filter ──────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      prisma: ${{ steps.filter.outputs.prisma }}
      shared: ${{ steps.filter.outputs.shared }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'prisma/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
            frontend:
              - 'apps/frontend/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
            prisma:
              - 'prisma/**'
            shared:
              - 'packages/shared/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            docker:
              - 'docker/**'
              - 'docker-compose*.yml'
              - '.dockerignore'

  # ─── Typecheck ────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck backend
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
        run: pnpm --filter @lis/backend typecheck
      - name: Typecheck frontend
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
        run: pnpm --filter @lis/frontend typecheck

  # ─── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lis/backend lint
      - run: pnpm --filter @lis/frontend lint

  # ─── Backend tests ────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lis_user
          POSTGRES_PASSWORD: lis_password
          POSTGRES_DB: lis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://lis_user:lis_password@localhost:5432/lis_test
      SESSION_SECRET: test-ci-secret-do-not-use-in-production

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run migrations
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma

      - name: Run backend tests with coverage
        run: pnpm --filter @lis/backend test:coverage

      - name: Comment coverage on PR (backend)
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: backend
          json-summary-path: apps/backend/coverage/coverage-summary.json
          json-final-path: apps/backend/coverage/coverage-final.json

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          if-no-files-found: warn
          retention-days: 7

  # ─── Frontend tests ───────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run frontend tests with coverage
        run: pnpm --filter @lis/frontend test:coverage

      - name: Comment coverage on PR (frontend)
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: frontend
          json-summary-path: apps/frontend/coverage/coverage-summary.json
          json-final-path: apps/frontend/coverage/coverage-final.json

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/
          if-no-files-found: warn
          retention-days: 7

  # ─── Prisma schema-drift guard ────────────────────────────────────────────
  prisma-drift:
    name: Prisma schema drift
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.prisma == 'true' || needs.changes.outputs.workflows == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lis_user
          POSTGRES_PASSWORD: lis_password
          POSTGRES_DB: lis_drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://lis_user:lis_password@localhost:5432/lis_drift

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Apply migrations to clean DB
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma

      # Fails if committed migrations do not produce the schema declared in
      # schema.prisma (i.e. schema.prisma was edited without a new migration).
      - name: Diff migrations -> schema.prisma (exit non-zero on drift)
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code

      # Belt-and-braces: applied DB state must equal schema.prisma.
      - name: Diff applied DB -> schema.prisma (exit non-zero on drift)
        run: |
          pnpm exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

  # ─── Playwright E2E ───────────────────────────────────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [changes, backend-tests, frontend-tests]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lis_user
          POSTGRES_PASSWORD: lis_password
          POSTGRES_DB: lis_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://lis_user:lis_password@localhost:5432/lis_e2e
      SESSION_SECRET: test-ci-e2e-secret
      PORT: 3001

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run migrations and seed
        run: |
          pnpm exec prisma migrate deploy --schema=prisma/schema.prisma
          pnpm exec tsx prisma/seed.ts

      - name: Build backend
        run: pnpm --filter @lis/backend build

      - name: Start backend in background
        run: node apps/backend/dist/server.js &
        env:
          DATABASE_URL: postgresql://lis_user:lis_password@localhost:5432/lis_e2e
          SESSION_SECRET: test-ci-e2e-secret
          NODE_ENV: production

      - name: Build frontend
        run: pnpm --filter @lis/frontend build
        env:
          VITE_PASSWORD_AUTH: 'true'

      - name: Serve built frontend on :5173
        run: pnpm --filter @lis/frontend exec vite preview --host 0.0.0.0 --port 5173 --strictPort &

      - name: Wait for backend + frontend to be ready
        run: pnpm dlx wait-on@7 http://localhost:3001/health http://localhost:5173 --timeout 60000

      - name: Install Playwright browsers
        run: pnpm --filter @lis/frontend exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter @lis/frontend test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          PLAYWRIGHT_BACKEND_URL: http://localhost:3001

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: apps/frontend/test-results/
          retention-days: 7
