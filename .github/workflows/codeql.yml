name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly Sunday 06:00 UTC
    - cron: '0 6 * * 0'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The repository is public, so code scanning is available without an
    # Advanced Security licence: results upload to the Security tab, and a
    # pull request gets inline annotations for the findings it introduces.
    # (While the repository was private, codeql-action/init failed with
    # "Requires authentication", the job was marked non-blocking, and the
    # SARIF was parked in a build artifact that nobody opened. The last such
    # artifact held 55 findings, 20 of them security.)
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
