name: OSV-Scanner

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: osv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    name: OSV scan
    # Reusable workflow published by the OSV-Scanner project.
    # See https://google.github.io/osv-scanner/github-action/
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.0.2
    with:
      scan-args: |-
        --recursive
        --lockfile=./pnpm-lock.yaml
        ./
    permissions:
      contents: read
      security-events: write
      actions: read
