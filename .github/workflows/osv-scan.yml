name: OSV-Scanner

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: osv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    name: OSV scan
    # Reusable workflow published by the OSV-Scanner project.
    # See https://google.github.io/osv-scanner/github-action/
    # fail-on-vuln: false → SARIF still uploads to code scanning, but the
    # build does not fail on transitive npm CVEs we haven't yet remediated
    # (matches the Trivy-image pattern in release-images.yml).
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.0.2
    with:
      scan-args: |-
        --recursive
        --lockfile=./pnpm-lock.yaml
        ./
      fail-on-vuln: false
    permissions:
      contents: read
      security-events: write
      actions: read
