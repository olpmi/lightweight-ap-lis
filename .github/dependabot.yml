version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      # Packages that only work when bumped together. Listed before the
      # catch-all because a package joins the first group that matches it, and
      # given no update-types so that a major arrives with its partners too.
      # (vitest 4 without @vitest/coverage-v8 4, and pino 10 without
      # pino-http 11, each failed CI as single-package PRs.)
      vitest:
        patterns: ['vitest', '@vitest/*']
      pino:
        patterns: ['pino', 'pino-http', 'pino-pretty']
      prisma:
        patterns: ['prisma', '@prisma/*']
      express:
        patterns: ['express', '@types/express', '@types/express-serve-static-core']
      testing-library:
        patterns: ['@testing-library/*']
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Hold back ecosystem majors that require deliberate migrations. Alerts
      # for these still appear in the Security tab; only the automatic PR is
      # suppressed. Revisit quarterly (next: February 2027).
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@mui/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-major]
      # Prisma 7 changes the client architecture (config file, driver adapters).
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/client'
        update-types: [version-update:semver-major]
      # express 5 changes route path syntax and request/response APIs.
      - dependency-name: express
        update-types: [version-update:semver-major]
      - dependency-name: '@types/express'
        update-types: [version-update:semver-major]
      # vite is held at 6 by the workspace override; @vitejs/plugin-react 6
      # needs vite 8, so both move together when that upgrade is planned.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
      # vitest 5 changed the Assertion type parameters; @testing-library/jest-dom
      # (through 7.0.1) still augments the old shape, so the frontend typecheck
      # fails until jest-dom catches up.
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]
      # @types/node tracks the Node 22 runtime. It moves together with the
      # Docker base image, the engines field, and the CI setup default.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    ignore:
      # The Node runtime moves as one planned change together with @types/node,
      # the engines field, and the CI setup default. Revisit with the npm
      # majors above (next: February 2027).
      - dependency-name: node
        update-types: [version-update:semver-major]
