server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers --------------------------------------------------
    # HSTS: only meaningful when this server (or the upstream LB) terminates
    # TLS; always-set is safe behind a reverse proxy that does.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options             "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options      "nosniff"                          always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;
    # CSP: the app is a Vite-built SPA that talks only to its own /api. Inline
    # styles are still emitted by MUI/emotion; inline scripts are not used at
    # runtime but Vite injects one bootstrap snippet in index.html so we allow
    # 'unsafe-inline' on script-src only. data: is needed for MUI icon URIs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # SPA fallback - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
